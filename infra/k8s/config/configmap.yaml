# Stores non-sensitive configuration data for the application
apiVersion: v1
kind: ConfigMap
metadata:
  name: sroa-config
  namespace: sroa
data:
  # Database and Infrastructure hostnames within the cluster
  POSTGRES_HOST: "postgres"
  # Full DSN used by services that read POSTGRES_DSN directly
  POSTGRES_DSN: "postgresql://sroa:sroa@postgres:5432/sroa"
  REDIS_URL: "redis://redis:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  
  # AI Model configurations
  GEMINI_CHAT_MODEL: "gemini-2.0-flash"
  OPENROUTER_CHAT_MODEL: "google/gemini-2.0-flash-001"
