# StatefulSet for PostgreSQL to ensure data persistence and stable naming
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sroa
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        # Ensures the data volume has the correct permissions for the postgres user (UID 999)
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                { secretKeyRef: { name: sroa-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom:
                { secretKeyRef: { name: sroa-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom:
                { secretKeyRef: { name: sroa-secrets, key: POSTGRES_DB } }
            # Fix: EBS mounts create a lost+found dir. PGDATA must use a subdirectory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Check if the DB is still alive
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sroa"]
            initialDelaySeconds: 30
            periodSeconds: 10
          # Check if the DB is ready to accept connections
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sroa"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  # Automatically creates a Persistent Volume Claim for each replica
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "sroa-storage"
        resources:
          requests:
            storage: 10Gi
