# Deployment for the static React frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sroa
spec:
  # Run 2 replicas for high availability
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Prevents both frontend pods from running on the same physical node
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - frontend
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: frontend
          image: 815210276744.dkr.ecr.eu-west-1.amazonaws.com/sroa-frontend:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Basic HTTP health checks
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
