# Comprehensive list of all backend microservices
apiVersion: v1
kind: List
items:
# --- AUTH SERVICE ---
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: auth-service
    namespace: sroa
  spec:
    replicas: 1
    selector:
      matchLabels: { app: auth-service }
    template:
      metadata:
        labels: { app: auth-service }
      spec:
        containers:
        - name: auth-service
          image: 815210276744.dkr.ecr.eu-west-1.amazonaws.com/sroa-auth-service:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          # Health checks to ensure the service is running and ready
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10 }
          envFrom:
          - configMapRef: { name: sroa-config }
          - secretRef: { name: sroa-secrets }

