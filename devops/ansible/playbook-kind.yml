---
- name: Provision Kind cluster host
  hosts: kind
  become: true
  vars:
    kind_cluster_name: sroa
    metallb_ip_pool: "172.18.0.240-172.18.0.250"
  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - python3-pip
          - software-properties-common
        state: present

    - name: Install Docker
      apt:
        name:
          - docker.io
        state: present

    - name: Ensure docker service started
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ansible user to docker group
      user:
        name: "{{ ansible_user | default('ubuntu') }}"
        groups: docker
        append: true

    - name: Install kind
      get_url:
        url: https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
        dest: /usr/local/bin/kind
        mode: '0755'

    - name: Install kubectl
      shell: |
        curl -LO https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl
        install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      args:
        creates: /usr/local/bin/kubectl

    - name: Install Helm
      shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Create Kind cluster config file
      copy:
        dest: /tmp/kind-cluster-config.yaml
        content: |
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
            - role: worker

    - name: Create Kind cluster if missing
      shell: |
        if ! kind get clusters | grep -qx "${kind_cluster_name}"; then
          kind create cluster --name "${kind_cluster_name}" --config /tmp/kind-cluster-config.yaml
        fi
      args:
        creates: "/root/.kube/config"

    - name: Install MetalLB
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.0/config/manifests/metallb-native.yaml
        cat <<'EOF' | kubectl apply -f -
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: metallb-ip-pool
          namespace: metallb-system
        spec:
          addresses:
            - {{ metallb_ip_pool }}
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: l2-advertisement
          namespace: metallb-system
        spec: {}
        EOF
      args:
        executable: /bin/bash

    - name: Install Prometheus and Grafana
      shell: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update
        helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
          --namespace monitoring --create-namespace \
          --set grafana.service.type=NodePort \
          --set prometheus.service.type=NodePort
      args:
        executable: /bin/bash
