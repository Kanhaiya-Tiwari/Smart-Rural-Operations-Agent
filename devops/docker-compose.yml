version: "3.9"

services:
  frontend:
    build:
      context: ..
      dockerfile: devops/docker/frontend.Dockerfile
    image: sroa-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ..
      dockerfile: devops/docker/backend.Dockerfile
    image: sroa-backend:latest
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://sroa:sroa@db:5432/sroa
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sroa
      POSTGRES_PASSWORD: sroa
      POSTGRES_DB: sroa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
