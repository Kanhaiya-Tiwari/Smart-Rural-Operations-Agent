name: backend-ci

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - user-profile-service
          - weather-service
          - market-service
          - agent-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/${{ matrix.service }}/requirements.txt

      - name: Lint import check
        run: |
          python -c "import importlib.util; print('ok')"

      - name: Build Docker image
        run: |
          docker build -t sroa/${{ matrix.service }}:ci backend/${{ matrix.service }}
