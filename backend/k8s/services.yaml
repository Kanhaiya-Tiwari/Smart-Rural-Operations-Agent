apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: sroa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/your-org/sroa-auth-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sroa-config
            - secretRef:
                name: sroa-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: sroa
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
---
