name: Reusable lint and Bandit scan

on:
  workflow_call:

jobs:
  lint-and-bandit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm run test -- --run

  backend-bandit-scan:
    runs-on: ubuntu-latest
    needs: lint-and-bandit
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Bandit
        run: python -m pip install --upgrade pip && python -m pip install bandit

      - name: Run Bandit security scan
        run: bandit -r backend -lll -f json -o bandit-report.json
