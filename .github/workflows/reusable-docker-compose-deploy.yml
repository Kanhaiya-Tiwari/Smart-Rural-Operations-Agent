name: Reusable Docker Compose deploy

on:
  workflow_call:
    inputs:
      frontend_image_repo:
        required: false
        type: string
        default: "kanhaiyatiwari/sroa-frontend"
      backend_image_repo:
        required: false
        type: string
        default: "kanhaiyatiwari/sroa-backend"
      image_tag:
        required: true
        type: string
      deploy_host:
        required: false
        type: string
        default: ""
      deploy_user:
        required: false
        type: string
        default: ""
    secrets:
      deploy_key:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images Built & Pushed:" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** \`${{ inputs.frontend_image_repo }}:${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Services:**" >> $GITHUB_STEP_SUMMARY
          echo "  - Auth: \`${{ inputs.backend_image_repo }}-auth:${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - User Profile: \`${{ inputs.backend_image_repo }}-user-profile:${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Weather: \`${{ inputs.backend_image_repo }}-weather:${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Market: \`${{ inputs.backend_image_repo }}-market:${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Agent: \`${{ inputs.backend_image_repo }}-agent:${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Notification: \`${{ inputs.backend_image_repo }}-notification:${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 To Deploy Locally:" >> $GITHUB_STEP_SUMMARY
          echo "```bash" >> $GITHUB_STEP_SUMMARY
          echo "# Pull the images" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ inputs.frontend_image_repo }}:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ inputs.backend_image_repo }}-auth:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ inputs.backend_image_repo }}-user-profile:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ inputs.backend_image_repo }}-weather:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ inputs.backend_image_repo }}-market:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ inputs.backend_image_repo }}-agent:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ inputs.backend_image_repo }}-notification:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Run with Docker Compose" >> $GITHUB_STEP_SUMMARY
          echo "cd backend" >> $GITHUB_STEP_SUMMARY
          echo "docker compose up -d" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Access the Application:" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** http://localhost:8080" >> $GITHUB_STEP_SUMMARY
          echo "- **Auth Service:** http://localhost:8092" >> $GITHUB_STEP_SUMMARY
          echo "- **User Profile:** http://localhost:8093" >> $GITHUB_STEP_SUMMARY
          echo "- **Weather Service:** http://localhost:8094" >> $GITHUB_STEP_SUMMARY
          echo "- **Market Service:** http://localhost:8095" >> $GITHUB_STEP_SUMMARY
          echo "- **Agent Service:** http://localhost:8096" >> $GITHUB_STEP_SUMMARY
          echo "- **Notification Service:** http://localhost:8097" >> $GITHUB_STEP_SUMMARY

      - name: Deploy to remote server (if configured)
        if: inputs.deploy_host != ''
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ inputs.deploy_host }}
          username: ${{ inputs.deploy_user }}
          key: ${{ secrets.deploy_key }}
          script: |
            cd /opt/sroa
            docker compose pull
            docker compose up -d
