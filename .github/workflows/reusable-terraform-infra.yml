name: Reusable Terraform infrastructure

on:
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string
      project_name:
        required: false
        type: string
        default: "sroa"
      ami_id:
        required: false
        type: string
        default: ""
      instance_type:
        required: false
        type: string
        default: "t3.large"
      key_name:
        required: true
        type: string
      ssh_cidr:
        required: false
        type: string
        default: "0.0.0.0/0"
      destroy:
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
    outputs:
      ec2_public_ip:
        value: ${{ jobs.terraform.outputs.ec2_public_ip }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      ec2_public_ip: ${{ steps.outputs.outputs.public_ip }}
    env:
      TF_VAR_project_name: ${{ inputs.project_name }}-${{ github.run_number }}
    defaults:
      run:
        working-directory: devops/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Debug project name
        run: |
          echo "Project name: $TF_VAR_project_name"

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_aws_region: ${{ inputs.aws_region }}
          TF_VAR_ami_id: ${{ inputs.ami_id }}
          TF_VAR_instance_type: ${{ inputs.instance_type }}
          TF_VAR_key_name: ${{ inputs.key_name }}
          TF_VAR_ssh_cidr: ${{ inputs.ssh_cidr }}
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          TF_VAR_dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Terraform Apply
        if: inputs.destroy == false
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: inputs.destroy == true
        run: terraform destroy -auto-approve
        env:
          TF_VAR_aws_region: ${{ inputs.aws_region }}
          TF_VAR_ami_id: ${{ inputs.ami_id }}
          TF_VAR_instance_type: ${{ inputs.instance_type }}
          TF_VAR_key_name: ${{ inputs.key_name }}
          TF_VAR_ssh_cidr: ${{ inputs.ssh_cidr }}
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          TF_VAR_dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Get EC2 Public IP
        if: inputs.destroy == false
        id: outputs
        run: |
          PUBLIC_IP=$(terraform output -raw ec2_public_ip)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "## 🌐 EC2 Instance Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Public IP:** \`$PUBLIC_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Kind Cluster:** Running on port 80/443" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SSH Connection:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "ssh -i your-key.pem ubuntu@$PUBLIC_IP" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
