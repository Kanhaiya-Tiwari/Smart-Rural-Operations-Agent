name: Full security, build, deploy, and notification pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL for OWASP ZAP DAST scan"
        required: false
        default: "https://example.com"
      image_tag:
        description: "Image tag to build and deploy"
        required: false
        default: "latest"

jobs:
  lint-and-bandit:
    uses: ./.github/workflows/reusable-lint-bandit.yml

  dockerfile-scan:
    uses: ./.github/workflows/reusable-dockerfile-scan.yml

  build-images:
    needs: [lint-and-bandit, dockerfile-scan]
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      image_tag: ${{ github.event.inputs.image_tag && github.event.inputs.image_tag != '' && github.event.inputs.image_tag || github.sha }}
      frontend_image_repo: ${{ vars.FRONTEND_IMAGE_REPO || 'kanhaiyatiwari/sroa-frontend' }}
      backend_image_repo: ${{ vars.BACKEND_IMAGE_REPO || 'kanhaiyatiwari/sroa-backend' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  trivy-scan:
    needs: build-images
    uses: ./.github/workflows/reusable-trivy-scan.yml
    with:
      images: ${{ needs.build-images.outputs.image_list }}

  terraform-infra:
    needs: trivy-scan
    uses: ./.github/workflows/reusable-terraform-infra.yml
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-2' }}
      ami_id: ${{ vars.AWS_AMI_ID }}
      instance_type: ${{ vars.AWS_INSTANCE_TYPE || 't3.large' }}
      key_name: ${{ vars.AWS_KEY_NAME }}
      ssh_cidr: ${{ vars.AWS_SSH_CIDR || '0.0.0.0/0' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy:
    needs: terraform-infra
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      frontend_image_repo: ${{ vars.FRONTEND_IMAGE_REPO || 'kanhaiyatiwari/sroa-frontend' }}
      backend_image_repo: ${{ vars.BACKEND_IMAGE_REPO || 'kanhaiyatiwari/sroa-backend' }}
      image_tag: ${{ github.event.inputs.image_tag && github.event.inputs.image_tag != '' && github.event.inputs.image_tag || github.sha }}
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
      EC2_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
      EC2_HOST: ${{ needs.terraform-infra.outputs.ec2_public_ip || '' }}

  dast-scan:
    needs: deploy
    if: success() || failure()
    uses: ./.github/workflows/reusable-dast-owasp-zap.yml
    with:
      target_url: ${{ github.event.inputs.target_url && github.event.inputs.target_url != '' && github.event.inputs.target_url || 'https://example.com' }}

  notify:
    needs: dast-scan
    if: success() || failure()
    uses: ./.github/workflows/reusable-email-notify.yml
    with:
      recipient: "knhapndt1@gmail.com"
      subject: "SROA deployment completed"
      message: |
        Deployment succeeded for tag: ${{ github.event.inputs.image_tag && github.event.inputs.image_tag != '' && github.event.inputs.image_tag || github.sha }}
        DAST target: ${{ github.event.inputs.target_url && github.event.inputs.target_url != '' && github.event.inputs.target_url || 'https://example.com' }}
        Workflow: ${{ github.workflow }}
      from: ${{ vars.GMAIL_SMTP_USERNAME || 'your-email@gmail.com' }}
    secrets:
      GMAIL_SMTP_USERNAME: ${{ secrets.GMAIL_SMTP_USERNAME }}
      GMAIL_SMTP_PASSWORD: ${{ secrets.GMAIL_SMTP_PASSWORD }}
