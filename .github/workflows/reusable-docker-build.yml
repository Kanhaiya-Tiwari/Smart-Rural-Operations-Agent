name: Reusable Docker build

on:
  workflow_call:
    inputs:
      image_tag:
        required: false
        type: string
        default: ${{ github.sha }}
      frontend_image_repo:
        required: true
        type: string
      backend_image_repo:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    outputs:
      image_list: ${{ steps.set-outputs.outputs.image_list }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: docker build -t ${{ inputs.frontend_image_repo }}:${{ inputs.image_tag }} -f devops/docker/frontend.Dockerfile .

      - name: Build auth-service image
        run: docker build -t ${{ inputs.backend_image_repo }}-auth:${{ inputs.image_tag }} -f backend/auth-service/Dockerfile backend/auth-service

      - name: Build user-profile-service image
        run: docker build -t ${{ inputs.backend_image_repo }}-user-profile:${{ inputs.image_tag }} -f backend/user-profile-service/Dockerfile backend/user-profile-service

      - name: Build weather-service image
        run: docker build -t ${{ inputs.backend_image_repo }}-weather:${{ inputs.image_tag }} -f backend/weather-service/Dockerfile backend/weather-service

      - name: Build market-service image
        run: docker build -t ${{ inputs.backend_image_repo }}-market:${{ inputs.image_tag }} -f backend/market-service/Dockerfile backend/market-service

      - name: Build agent-service image
        run: docker build -t ${{ inputs.backend_image_repo }}-agent:${{ inputs.image_tag }} -f backend/agent-service/Dockerfile backend/agent-service

      - name: Build notification-service image
        run: docker build -t ${{ inputs.backend_image_repo }}-notification:${{ inputs.image_tag }} -f backend/notification-service/Dockerfile backend/notification-service

      - name: Push frontend image
        run: docker push ${{ inputs.frontend_image_repo }}:${{ inputs.image_tag }}

      - name: Push backend images
        run: |
          docker push ${{ inputs.backend_image_repo }}-auth:${{ inputs.image_tag }}
          docker push ${{ inputs.backend_image_repo }}-user-profile:${{ inputs.image_tag }}
          docker push ${{ inputs.backend_image_repo }}-weather:${{ inputs.image_tag }}
          docker push ${{ inputs.backend_image_repo }}-market:${{ inputs.image_tag }}
          docker push ${{ inputs.backend_image_repo }}-agent:${{ inputs.image_tag }}
          docker push ${{ inputs.backend_image_repo }}-notification:${{ inputs.image_tag }}

      - name: Output image list
        id: set-outputs
        run: |
          echo "image_list=${{ inputs.frontend_image_repo }}:${{ inputs.image_tag }},${{ inputs.backend_image_repo }}-auth:${{ inputs.image_tag }},${{ inputs.backend_image_repo }}-user-profile:${{ inputs.image_tag }},${{ inputs.backend_image_repo }}-weather:${{ inputs.image_tag }},${{ inputs.backend_image_repo }}-market:${{ inputs.image_tag }},${{ inputs.backend_image_repo }}-agent:${{ inputs.image_tag }},${{ inputs.backend_image_repo }}-notification:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
