name: Reusable Kubernetes deploy

on:
  workflow_call:
    inputs:
      frontend_image_repo:
        required: true
        type: string
      backend_image_repo:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      KUBECONFIG:
        required: false
      EC2_SSH_KEY:
        required: false
      EC2_HOST:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.16.0

      - name: Get kubeconfig from EC2 Kind cluster
        if: env.EC2_HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Wait for EC2 to be ready and Kind cluster to be set up
          echo "Waiting for EC2 instance and Kind cluster to be ready..."
          for i in {1..30}; do
            if ssh ubuntu@$EC2_HOST "kind get clusters" 2>/dev/null; then
              echo "Kind cluster is ready!"
              break
            fi
            echo "Attempt $i/30: Kind cluster not ready yet, waiting 10 seconds..."
            sleep 10
          done
          
          # Get kubeconfig
          mkdir -p ~/.kube
          ssh ubuntu@$EC2_HOST "kind get kubeconfig --name kind" > ~/.kube/config
          chmod 600 ~/.kube/config
          
          # Verify kubeconfig
          if [ ! -s ~/.kube/config ]; then
            echo "Error: kubeconfig is empty!"
            exit 1
          fi

      - name: Set kubeconfig from secret
        if: env.KUBECONFIG_SECRET != ''
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_SECRET" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy with Helm
        continue-on-error: true
        run: |
          helm upgrade --install sroa devops/helm/sroa \
            --namespace sroa --create-namespace \
            --set frontend.image.repository=${{ inputs.frontend_image_repo }} \
            --set frontend.image.tag=${{ inputs.image_tag }} \
            --set backend.image.repository=${{ inputs.backend_image_repo }} \
            --set backend.image.tag=${{ inputs.image_tag }}
