name: Reusable Trivy image scan

on:
  workflow_call:
    inputs:
      images:
        required: true
        type: string

jobs:
  scan-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/download/v0.56.0/trivy_0.56.0_Linux-64bit.tar.gz
          tar -xzf trivy_0.56.0_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/
          rm trivy_0.56.0_Linux-64bit.tar.gz

      - name: Scan images
        run: |
          set -e
          IFS=',' read -r -a images <<< "${{ inputs.images }}"
          for image in "${images[@]}"; do
            echo "Scanning $image"
            trivy image --exit-code 1 --severity CRITICAL,HIGH "$image"
          done
